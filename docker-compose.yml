services:
  mongodb:
    image: mongo:7.0
    container_name: ther_inv_mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ther_inv
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ther_inv_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ther_inv_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/ther_inv
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_ther_inv_key_change_in_production_2026}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-roger@admin.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123456}
      - ADMIN_NAME=${ADMIN_NAME:-Roger (Admin)}
      - MANAGER_EMAIL=${MANAGER_EMAIL:-therina@agency.com}
      - MANAGER_PASSWORD=${MANAGER_PASSWORD:-therina123456}
      - MANAGER_NAME=${MANAGER_NAME:-Therina}
    depends_on:
      - mongodb
    networks:
      - ther_inv_network

volumes:
  mongo_data:
    driver: local

networks:
  ther_inv_network:
    driver: bridge
